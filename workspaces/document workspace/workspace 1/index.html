<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS — theme variables. Only axis meant to change at runtime.
   Adding a new theme = adding one more [data-theme="x"] block below.
   ========================================================================== */
:root{
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;

  --ease: cubic-bezier(.4,0,.2,1);
  --dur-fast: .12s;
  --dur: .2s;
  --dur-slow: .32s;

  --sidebar-w: 264px;
  --content-w: 760px;
}

html[data-theme="light"]{
  --bg: #ffffff;
  --bg-raised: #ffffff;
  --sidebar-bg: #fbfbfa;
  --overlay-bg: rgba(255,255,255,.86);

  --text: #1f1f1e;
  --text-secondary: #6f6e69;
  --text-tertiary: #85847f;

  --border: #e9e9e7;
  --border-strong: #dcdbd7;

  --hover: rgba(15,15,15,.05);
  --active: rgba(15,15,15,.08);

  --accent: #2461e8;
  --accent-text: #ffffff;
  --accent-soft: rgba(36,97,232,.1);

  --danger: #d84545;
  --danger-soft: rgba(216,69,69,.1);

  --shadow-menu: 0 6px 24px rgba(15,15,15,.12), 0 1px 2px rgba(15,15,15,.06);
  --scrollbar: rgba(15,15,15,.18);
}

html[data-theme="dark"]{
  --bg: #000000;
  --bg-raised: #111110;
  --sidebar-bg: #0a0a09;
  --overlay-bg: rgba(0,0,0,.86);

  --text: #ededec;
  --text-secondary: #9b9a96;
  --text-tertiary: #8a8985;

  --border: #232322;
  --border-strong: #323230;

  --hover: rgba(255,255,255,.06);
  --active: rgba(255,255,255,.1);

  --accent: #5b8def;
  --accent-text: #08101f;
  --accent-soft: rgba(91,141,239,.16);

  --danger: #f0716f;
  --danger-soft: rgba(240,113,111,.14);

  --shadow-menu: 0 6px 24px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
  --scrollbar: rgba(255,255,255,.16);
}

html[data-theme="offwhite"]{

  --border:#e8e4d8; --border-strong:#d9d4c4;

/* ==========================================================================
   RESET / BASE
   ========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; overflow:hidden; overscroll-behavior:none; touch-action:pan-x pan-y; }
body, button, .icon-btn, .tree-row, .tb-btn{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
input, textarea, [contenteditable]{ touch-action:manipulation; }
body{
  margin:0;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
  overflow:hidden;
}
h1,h2,h3,p,ul,ol{ margin:0; }
button{ font-family:inherit; }
[contenteditable]{ outline:none; }
[contenteditable][data-placeholder]:empty::before{
  content:attr(data-placeholder);
  color:var(--text-tertiary);
  pointer-events:none;
}
::selection{ background:var(--accent-soft); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:transparent; border-radius:8px; border:2.5px solid transparent; background-clip:padding-box; }
*:hover::-webkit-scrollbar-thumb{ background-color:var(--scrollbar); background-clip:padding-box; }

button.reset{
  appearance:none; border:none; background:none; color:inherit;
  cursor:pointer; padding:0;
}
.icon{ width:16px; height:16px; flex-shrink:0; display:block; }
.icon svg{ width:100%; height:100%; }

/* ==========================================================================
   APP SHELL
   ========================================================================== */
#app{ display:flex; height:100vh; height:100dvh; width:100%; position:relative; overflow:hidden; }

/* ---- Sidebar ---- */
#sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:var(--sidebar-bg);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  transition:background-color var(--dur) var(--ease), border-color var(--dur) var(--ease),
             transform var(--dur-slow) var(--ease);
  z-index:40;
}
.sidebar-top{
  height:52px; flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 8px 0 16px;
}
.brand{
  font-weight:700; font-size:14px; letter-spacing:.01em;
  display:flex; align-items:center; gap:8px; color:var(--text);
}
.brand-mark{
  width:18px; height:18px; border-radius:5px;
  background:var(--text); flex-shrink:0;
}
html[data-theme="dark"] .brand-mark{ background:var(--text); }

.icon-btn{
  width:26px; height:26px; border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary);
  transition:background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.icon-btn:hover{ background:var(--hover); color:var(--text); }
.icon-btn.active{ background:var(--active); color:var(--text); }
.icon-btn.disabled{ opacity:.35; pointer-events:none; cursor:default; }

.sidebar-new{
  margin:2px 8px 8px;
  height:32px; padding:0 10px;
  display:flex; align-items:center; gap:8px;
  border-radius:var(--radius-sm);
  color:var(--text-secondary);
  font-size:13px; font-weight:500;
  transition:background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.sidebar-new:hover{ background:var(--hover); color:var(--text); }

.sidebar-tree{
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:2px 8px 12px;
}
.tree-empty{
  padding:10px 8px; font-size:12.5px; color:var(--text-tertiary);
}

.sidebar-bottom{
  flex-shrink:0; border-top:1px solid var(--border);
  padding:6px 8px; display:flex; flex-direction:column; gap:1px;
  transition:border-color var(--dur) var(--ease);
}
.sidebar-row{
  height:32px; padding:0 8px; border-radius:var(--radius-sm);
  display:flex; align-items:center; gap:9px;
  font-size:13px; color:var(--text-secondary); font-weight:500;
  transition:background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.sidebar-row:hover{ background:var(--hover); color:var(--text); }

/* ---- Tree rows ---- */
.tree-node{ position:relative; }
.tree-row{
  height:30px; display:flex; align-items:center;
  border-radius:var(--radius-sm); cursor:pointer;
  position:relative; padding-right:4px;
  transition:background-color var(--dur-fast) var(--ease);
}
.tree-row:hover{ background:var(--hover); }
.tree-row.active{ background:var(--active); }
.tree-row.active .tree-label{ font-weight:600; }

.tree-toggle{
  width:20px; height:20px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border-radius:4px; color:var(--text-tertiary);
}
.tree-toggle:hover{ background:var(--active); color:var(--text); }
.tree-toggle svg{ transition:transform var(--dur) var(--ease); transform:rotate(0deg); }
.tree-toggle.expanded svg{ transform:rotate(90deg); }
.tree-toggle.leaf{ visibility:hidden; cursor:default; }

.tree-type-icon{
  width:14px; height:14px; margin-right:6px; flex-shrink:0; color:var(--text-tertiary);
}
.tree-label{
  flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-size:13.5px; color:var(--text); padding-left:2px;
}
.tree-label.untitled{ color:var(--text-tertiary); }

.tree-actions{
  display:flex; align-items:center; gap:1px;
  opacity:.7; transition:opacity var(--dur-fast) var(--ease);
  flex-shrink:0;
}
.tree-row:hover .tree-actions, .tree-row.active .tree-actions{ opacity:1; }
.tree-actions .icon-btn{ width:22px; height:22px; }

.tree-children{
  display:grid; grid-template-rows:0fr;
  transition:grid-template-rows var(--dur-slow) var(--ease);
  overflow:hidden;
}
.tree-children.expanded{ grid-template-rows:1fr; }
.tree-children-inner{ min-height:0; overflow:hidden; }

/* ---- Sidebar overlay toggle (mobile) ---- */
#sidebar-scrim{
  position:fixed; inset:0; background:rgba(0,0,0,.35);
  opacity:0; pointer-events:none; transition:opacity var(--dur) var(--ease);
  z-index:35;
}
#sidebar-scrim.show{ opacity:1; pointer-events:auto; }

/* ---- Main ---- */
#main{ flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; height:100dvh; }

#topbar{
  height:48px; flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; border-bottom:1px solid transparent;
  transition:border-color var(--dur) var(--ease);
}
#topbar.scrolled{ border-color:var(--border); }
.breadcrumb{
  display:flex; align-items:center; gap:6px; min-width:0;
  font-size:13px; color:var(--text-secondary);
}
.crumb{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;
  transition:color var(--dur-fast) var(--ease);
}
.crumb.current{ color:var(--text); font-weight:500; }
.crumb-sep{ color:var(--text-tertiary); }
.topbar-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }

.btn{
  height:28px; padding:0 12px; border-radius:var(--radius-sm);
  font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;
  color:var(--text-secondary); border:1px solid transparent;
  transition:background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.btn:hover{ background:var(--hover); color:var(--text); }
.btn-primary{
  background:var(--accent); color:var(--accent-text); font-weight:600;
}
.btn-primary:hover{ background:var(--accent); filter:brightness(1.08); color:var(--accent-text); }
.btn-outline{ border-color:var(--border-strong); }
.btn-outline:hover{ border-color:var(--text-tertiary); }
.btn-danger{ color:var(--danger); }
.btn-danger:hover{ background:var(--danger-soft); color:var(--danger); }

#view-port{ flex:1; overflow-y:auto; overflow-x:hidden; position:relative; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.view{
  min-height:100%;
  animation:view-in var(--dur) var(--ease) both;
}
@keyframes view-in{ from{ opacity:0; } to{ opacity:1; } }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

/* ---- Editor ---- */
.editor-wrap{ max-width:var(--content-w); margin:0 auto; padding:64px 48px 40vh; }
.editor-title{
  font-size:2.4rem; font-weight:800; line-height:1.2; letter-spacing:-0.015em;
  min-height:1.2em; margin-bottom:14px; color:var(--text);
}
.editor-meta{
  display:flex; align-items:center; gap:10px;
  font-size:12px; color:var(--text-tertiary); margin-bottom:28px;
  font-family:var(--mono);
}
.editor-toolbar{
  display:flex; align-items:center; gap:2px; margin-bottom:18px;
  padding-bottom:14px; border-bottom:1px solid var(--border);
}
.tb-btn{
  width:28px; height:28px; border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); font-size:13px; font-weight:700; font-family:var(--sans);
  transition:background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.tb-btn:hover{ background:var(--hover); color:var(--text); }
.tb-sep{ width:1px; height:16px; background:var(--border); margin:0 6px; }

.editor-content{
  font-size:16px; line-height:1.7; color:var(--text); min-height:40vh;
}
.editor-content{ white-space:pre-wrap; overflow-wrap:anywhere; tab-size:4; }
.editor-content p, .editor-content div{ margin:0; min-height:1.7em; white-space:pre-wrap; tab-size:4; }
.editor-content h2{ font-size:1.5rem; line-height:1.3; margin:1.2em 0 .4em; }
.editor-content ul, .editor-content ol{ padding-left:1.5em; margin:.2em 0 .75em; }
.editor-content li{ margin:.15em 0; }
.editor-content b, .editor-content strong{ font-weight:700; }
.editor-content a{ color:var(--accent); }

.subpages-section{ margin-top:28px; padding-top:18px; border-top:1px solid var(--border); }
.subpages-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-tertiary); margin-bottom:8px; }
.subpage-link{
  display:flex; align-items:center; gap:9px; height:36px; padding:0 8px; margin:0 -8px;
  border-radius:var(--radius-sm); cursor:pointer;
  transition:background-color var(--dur-fast) var(--ease);
}
.subpage-link:hover{ background:var(--hover); }
.subpage-link-icon{ color:var(--text-tertiary); flex-shrink:0; }
.subpage-link-icon.is-folder{ color:var(--accent); }
.subpage-link-title{ flex:1; min-width:0; font-size:13.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-decoration:underline; text-decoration-color:var(--border-strong); text-underline-offset:3px; }
.subpage-link-title.untitled{ color:var(--text-tertiary); }
.subpage-link-more{ opacity:.7; transition:opacity var(--dur-fast) var(--ease); flex-shrink:0; }
.subpage-link:hover .subpage-link-more{ opacity:1; }

/* ---- Empty states ---- */
.empty-state{
  height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:40px; text-align:center;
}
.empty-mark{
  width:44px; height:44px; border-radius:var(--radius-lg);
  border:1.5px dashed var(--border-strong);
}
.empty-title{ font-size:15px; font-weight:600; color:var(--text); }
.empty-sub{ font-size:13px; color:var(--text-secondary); max-width:320px; }

/* ---- Menus / popovers ---- */
.menu{
  position:fixed; min-width:200px; background:var(--bg-raised);
  border:1px solid var(--border); border-radius:var(--radius-md);
  box-shadow:var(--shadow-menu); padding:5px; z-index:200;
  opacity:0; transform:scale(.97) translateY(-2px);
  animation:menu-in var(--dur-fast) var(--ease) forwards;
}
@keyframes menu-in{ to{ opacity:1; transform:scale(1) translateY(0); } }
.menu-item{
  display:flex; align-items:center; gap:10px; height:30px; padding:0 8px;
  border-radius:4px; font-size:13px; color:var(--text); position:relative;
  transition:background-color var(--dur-fast) var(--ease);
}
.menu-item:hover, .menu-item.open{ background:var(--hover); }
.menu-item.danger{ color:var(--danger); }
.menu-item.danger:hover{ background:var(--danger-soft); }
.menu-item .spacer{ flex:1; }
.menu-item .chev{ color:var(--text-tertiary); }
.menu-sep{ height:1px; background:var(--border); margin:5px 2px; }
.menu-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-tertiary); padding:6px 8px 4px; }

/* ---- Find in file ---- */
.find-bar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  max-width:var(--content-w); margin:0 auto; padding:8px 48px;
  background:var(--overlay-bg); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.find-bar[hidden]{ display:none; }
.find-input-wrap{
  flex:1 1 180px; min-width:0; display:flex; align-items:center; gap:8px;
  height:32px; padding:0 10px; border:1px solid var(--border-strong);
  border-radius:var(--radius-md); background:var(--bg-raised); color:var(--text-secondary);
}
.find-input-wrap:focus-within{ border-color:var(--accent); }
.find-input{
  flex:1; min-width:0; border:none; outline:none; background:transparent;
  color:var(--text); font-family:var(--sans); font-size:13px;
}
.find-count{ font-family:var(--mono); font-size:12px; color:var(--text-tertiary); white-space:nowrap; min-width:64px; text-align:right; }
.find-count.none{ color:var(--danger); }
.find-case{ width:28px; height:28px; font-size:12px; font-weight:600; }
.find-case.active{ background:var(--accent-soft); color:var(--accent); }
::highlight(find-match){ background-color:var(--find-match, rgba(255,204,0,.42)); color:inherit; }
::highlight(find-current){ background-color:var(--find-current, #ff9a2e); color:var(--find-current-text, #111); }
.menu-info{ font-family:var(--mono); font-size:12px; color:var(--text-secondary); padding:3px 8px 3px 36px; }
@media (max-width:820px){ .find-bar{ padding:8px 20px; } }

/* ---- Settings overlay ---- */
#settings-overlay{
  position:fixed; inset:0; background:var(--overlay-bg); backdrop-filter:blur(6px);
  z-index:100; display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
#settings-overlay.show{ opacity:1; pointer-events:auto; }
.settings-panel{
  width:min(760px, 92vw); height:min(520px, 84vh);
  background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius-lg);
  display:flex; overflow:hidden; box-shadow:var(--shadow-menu);
  transform:scale(.97) translateY(6px); transition:transform var(--dur) var(--ease);
}
#settings-overlay.show .settings-panel{ transform:scale(1) translateY(0); }
.settings-nav{
  width:200px; flex-shrink:0; border-right:1px solid var(--border);
  padding:16px 10px; display:flex; flex-direction:column; gap:1px;
  background:var(--sidebar-bg);
}
.settings-nav-title{ font-size:12px; font-weight:700; color:var(--text-tertiary); padding:4px 10px 10px; text-transform:uppercase; letter-spacing:.04em; }
.settings-nav-item{
  height:32px; padding:0 10px; border-radius:var(--radius-sm);
  display:flex; align-items:center; font-size:13.5px; color:var(--text-secondary);
  transition:background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.settings-nav-item:hover{ background:var(--hover); color:var(--text); }
.settings-nav-item.active{ background:var(--active); color:var(--text); font-weight:600; }
.settings-body{ flex:1; padding:26px 32px; overflow-y:auto; position:relative; }
.settings-close{ position:absolute; top:14px; right:14px; }
.settings-section-title{ font-size:17px; font-weight:700; margin-bottom:4px; }
.settings-section-sub{ font-size:13px; color:var(--text-secondary); margin-bottom:22px; }

.theme-category{ margin-bottom:26px; }
.theme-category-title{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-tertiary); font-weight:600; margin-bottom:10px; }
.theme-options{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:12px; }
.theme-opt{
  min-width:0; border:1.5px solid var(--border); border-radius:var(--radius-md);
  padding:8px; cursor:pointer; transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.theme-opt:hover{ transform:translateY(-1px); }
.theme-opt.selected{ border-color:var(--accent); }
.theme-swatch{
  height:64px; border-radius:5px; margin-bottom:8px; border:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.theme-swatch-bar{ height:16px; }
.theme-opt-label{ font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; }
.theme-check{ width:14px; height:14px; border-radius:50%; border:1.5px solid var(--border-strong); flex-shrink:0; transition:all var(--dur-fast) var(--ease); }
.theme-opt.selected .theme-check{ border-color:var(--accent); background:var(--accent); }

.field-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.field-row:last-child{ border-bottom:none; }
.field-label{ font-size:13.5px; font-weight:500; }
.field-sub{ font-size:12px; color:var(--text-secondary); margin-top:2px; }

/* ---- About page ---- */
.about-wrap{
  min-height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column;
  gap:22px; text-align:center; padding:64px 24px 40vh;
}
.about-text{ font-size:15px; color:var(--text-secondary); text-align:center; max-width:480px; line-height:1.6; }
.about-back{ display:flex; align-items:center; gap:6px; }
.about-section-heading{
  font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text-tertiary); margin-top:8px;
}
.about-folder-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:14px; width:100%; max-width:420px;
}
.static-folder-card{ cursor:pointer; }
.static-folder-card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* ---- Toast ---- */
#toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(12px);
  background:var(--bg-raised); border:1px solid var(--border); color:var(--text);
  padding:9px 16px; border-radius:var(--radius-md); font-size:13px; box-shadow:var(--shadow-menu);
  opacity:0; pointer-events:none; transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  z-index:300;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---- Search overlay ---- */
#search-overlay{
  position:fixed; inset:0; background:var(--overlay-bg); backdrop-filter:blur(6px);
  z-index:110; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;
  opacity:0; pointer-events:none; transition:opacity var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
#search-overlay.show{ opacity:1; pointer-events:auto; }
.search-panel{
  width:min(560px, 92vw); max-height:64vh; display:flex; flex-direction:column;
  background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-menu); overflow:hidden;
  transform:scale(.97) translateY(6px); transition:transform var(--dur) var(--ease);
}
#search-overlay.show .search-panel{ transform:scale(1) translateY(0); }
.search-input-row{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  border-bottom:1px solid var(--border); flex-shrink:0; color:var(--text-tertiary);
}
.search-input-row .icon{ color:var(--text-tertiary); }
#search-input{
  flex:1; border:none; outline:none; background:none; color:var(--text);
  font-family:var(--sans); font-size:14.5px;
}
#search-input::placeholder{ color:var(--text-tertiary); }
.search-results{ overflow-y:auto; padding:6px; }
.search-result{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--radius-sm);
  cursor:pointer; transition:background-color var(--dur-fast) var(--ease);
}
.search-result:hover, .search-result.active{ background:var(--hover); }
.search-result .icon{ color:var(--text-tertiary); flex-shrink:0; }
.search-result-main{ min-width:0; flex:1; }
.search-result-title{ font-size:13.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.search-result-path{ font-size:11.5px; color:var(--text-tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.type-badge{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  color:var(--text-tertiary); border:1px solid var(--border-strong); border-radius:4px;
  padding:1.5px 5px; flex-shrink:0; white-space:nowrap; line-height:1.5;
}
.type-badge.is-folder{ color:var(--accent); border-color:var(--accent-soft); background:var(--accent-soft); }
.search-empty{ padding:24px 10px; text-align:center; font-size:13px; color:var(--text-tertiary); }

/* ---- Masthead — "Textualistic" wordmark + animated wave rule ---- */
.masthead{ margin-bottom:34px; }
.masthead-title{
  font-size:clamp(2.6rem, 6vw, 4.2rem);
  font-weight:200;
  letter-spacing:-.02em;
  line-height:1;
  color:var(--text);
  margin:0 0 16px;
}
.about-heading{
  font-size:clamp(2rem, 5vw, 2.8rem);
  font-weight:200;
  letter-spacing:-.02em;
  line-height:1;
  color:var(--text);
  margin:0;
}
.about-link{ color:var(--accent); text-decoration:underline; text-underline-offset:3px; word-break:break-all; }
.wave-rule{
  display:block; width:100%; max-width:300px; height:26px;
  overflow:hidden; color:var(--text);
}
.wave-svg{ display:block; }
.wave-svg.wave-anim{ will-change:transform; }
@keyframes wave-scroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(-432px); }
}

/* ---- Home / folder gallery ---- */
.gallery-wrap{ max-width:960px; margin:0 auto; padding:56px 48px 40vh; }
.gallery-header{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
.gallery-title{
  font-size:2rem; font-weight:800; letter-spacing:-.015em; color:var(--text); min-height:1.2em; flex:1;
}
.gallery-sub{ font-size:12.5px; color:var(--text-tertiary); margin-bottom:28px; }
.gallery-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:14px;
}
.gallery-card{
  border:1px solid var(--border); border-radius:var(--radius-md); padding:14px;
  cursor:pointer; background:var(--bg-raised); display:flex; flex-direction:column; gap:10px;
  transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  min-height:104px; position:relative;
}
.gallery-card:hover{ border-color:var(--border-strong); transform:translateY(-1px); }
.gallery-card.drag-over{ border-color:var(--accent); }
.gallery-card-top{ display:flex; align-items:center; gap:6px; }
.gallery-card-icon{ width:22px; height:22px; color:var(--text-tertiary); flex-shrink:0; }
.gallery-card-icon.is-folder{ color:var(--accent); }
.gallery-card-more{ opacity:.7; transition:opacity var(--dur-fast) var(--ease); margin-left:auto; }
.gallery-card:hover .gallery-card-more{ opacity:1; }
.gallery-card-title{ font-size:13.5px; font-weight:600; color:var(--text); word-break:break-word; }
.gallery-card-title.untitled{ color:var(--text-tertiary); font-weight:500; }
.gallery-card-preview{ font-size:12px; color:var(--text-secondary); line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.gallery-card-meta{ font-size:11px; color:var(--text-tertiary); margin-top:auto; }
.gallery-empty{ padding:28px 4px; color:var(--text-tertiary); font-size:13px; }
.crumb.crumb-home{ display:flex; align-items:center; }
.crumb-link{ cursor:pointer; }
.crumb-link:hover{ color:var(--text); }

/* ---- Touch devices: no hover, so hover-only icons must always be visible ---- */
@media (hover:none), (pointer:coarse){
  .tree-actions, .subpage-link-more, .gallery-card-more{ opacity:1 !important; }
  .icon-btn{ width:32px; height:32px; }
  .tree-actions .icon-btn{ width:28px; height:28px; }
  .tb-btn{ width:34px; height:34px; }
}
.tree-row:focus-within .tree-actions,
.subpage-link:focus-within .subpage-link-more,
.gallery-card:focus-within .gallery-card-more{ opacity:1; }
.icon svg{ overflow:visible; }
.tree-type-icon{ color:var(--text); opacity:.8; }
.icon svg{ stroke-opacity:1; }
.tree-toggle{ color:var(--text-secondary) !important; }
.icon-btn{ color:var(--text-secondary); }
.tree-actions .icon-btn{ color:var(--text); }
/* deep nesting: tree scrolls sideways instead of clipping */
.sidebar-tree{ overflow-x:auto !important; }
.tree-node{ min-width:220px; }
.icon-btn{ color:var(--text-secondary); }

/* Sidebar tree is rebuilt on every state change; suppress transitions on the fresh nodes so icons don't flicker/re-animate */
#sidebar-tree.no-anim, #sidebar-tree.no-anim *{ transition:none !important; animation:none !important; }
.icon, .icon svg, .icon-btn svg, .tree-toggle svg{ backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.tree-toggle svg{ display:block; }

/* ---- Custom Colors accordion (Settings > Themes) ---- */
.cc-acc{ border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--bg-raised); overflow:hidden; }
.cc-acc-head{ width:100%; display:flex; align-items:center; gap:10px; padding:12px 14px; text-align:left; font-size:14px; font-weight:600; color:var(--text); }
.cc-acc-head:hover{ background:var(--hover); }
.cc-acc-head .cc-sub{ font-weight:400; font-size:12.5px; color:var(--text-tertiary); margin-left:auto; }
.cc-acc-head .cc-chev{ width:16px; height:16px; flex-shrink:0; color:var(--text-secondary); transition:transform var(--dur) var(--ease); }
.cc-acc.open .cc-acc-head .cc-chev{ transform:rotate(90deg); }
.cc-acc-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur-slow) var(--ease); }
.cc-acc.open .cc-acc-body{ grid-template-rows:1fr; }
.cc-acc-inner{ overflow:hidden; min-height:0; }
.cc-list{ padding:4px 14px 14px; border-top:1px solid var(--border); }
.cc-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
.cc-row:last-of-type{ border-bottom:none; }
.cc-name{ flex:1; min-width:0; font-size:13.5px; color:var(--text); }
.cc-hex{ font-family:var(--mono, ui-monospace, monospace); font-size:12px; color:var(--text-tertiary); min-width:64px; text-align:right; }
.cc-pick{ -webkit-appearance:none; appearance:none; width:38px; height:28px; padding:0; border:1px solid var(--border-strong); border-radius:var(--radius-md); background:none; cursor:pointer; }
.cc-pick::-webkit-color-swatch-wrapper{ padding:2px; }
.cc-pick::-webkit-color-swatch{ border:none; border-radius:4px; }
.cc-pick::-moz-color-swatch{ border:none; border-radius:4px; }
.cc-actions{ display:flex; justify-content:flex-end; padding-top:10px; }
.cc-panel{ padding-top:18px; }
.cc-panel .theme-category:last-child{ margin-bottom:0; }
.cc-box{ border:1px solid var(--border); border-radius:var(--radius-lg); padding:2px 14px; background:var(--bg-raised); }
.cc-acc-head .cc-sub{ margin-left:auto; }
/* ---- Responsive ---- */
.mobile-only{ display:none; }
@media (max-width: 780px){
  .mobile-only{ display:flex; }
  input, textarea, select, [contenteditable]{ font-size:16px !important; }
  .editor-title{ font-size:1.9rem; }
  #sidebar{ position:fixed; top:0; bottom:0; left:0; transform:translateX(-100%); box-shadow:var(--shadow-menu); }
  #sidebar.show{ transform:translateX(0); }
  .editor-wrap{ padding:40px 20px 40vh; }
  .gallery-wrap{ padding:32px 20px 40vh; }
  .gallery-title{ font-size:1.6rem; }
  .gallery-grid{ grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); }
  #search-overlay{ padding-top:6vh; }
  .search-panel{ width:94vw; max-height:78vh; }
  .settings-panel{ flex-direction:column; width:94vw; height:88vh; }
  .settings-nav{ width:100%; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border); }
}

/* ---- Settings — refined ---- */
#settings-overlay{ backdrop-filter:blur(10px) saturate(1.1); -webkit-backdrop-filter:blur(10px) saturate(1.1); }
.settings-panel{
  width:min(820px, 94vw); height:min(600px, 86vh); border-radius:16px;
  border:1px solid var(--border);
  box-shadow:0 24px 64px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.08);
  transform:scale(.965) translateY(10px); transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
.settings-nav{ width:212px; padding:20px 12px; gap:2px; }
.settings-nav-title{ font-size:11px; letter-spacing:.09em; padding:2px 12px 14px; }
.settings-nav-item{
  height:36px; padding:0 12px; gap:10px; border-radius:8px; cursor:pointer;
  position:relative; font-weight:500; user-select:none;
}
.settings-nav-item svg{ width:16px; height:16px; flex-shrink:0; opacity:.75; }
.settings-nav-item.active svg{ opacity:1; color:var(--accent); }
.settings-nav-item.active{ box-shadow:inset 0 0 0 1px var(--border); }
.settings-nav-item.active::before{
  content:''; position:absolute; left:-12px; top:9px; bottom:9px; width:3px;
  border-radius:0 3px 3px 0; background:var(--accent);
}
.settings-nav-sep{ height:1px; background:var(--border); margin:8px 10px; }
.settings-nav-item .nav-arrow{ margin-left:auto; width:13px; height:13px; opacity:.5; }
.settings-body{ padding:32px 40px 40px; scroll-behavior:smooth; }
.settings-body > *{ animation:settingsIn .28s cubic-bezier(.2,.8,.2,1) both; }
@keyframes settingsIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
.settings-close{ top:16px; right:16px; width:32px; height:32px; border-radius:50%; z-index:2; }
.settings-close:hover{ background:var(--hover); transform:rotate(90deg); }
.settings-close{ transition:transform .25s var(--ease), background-color var(--dur-fast) var(--ease); }
.settings-section-title{ font-size:22px; font-weight:800; letter-spacing:-.02em; margin-bottom:6px; }
.settings-section-sub{ font-size:13.5px; line-height:1.5; margin-bottom:28px; max-width:46ch; padding-bottom:22px; border-bottom:1px solid var(--border); max-width:none; }

.theme-category{ margin-bottom:30px; }
.theme-category-title{ font-size:11px; letter-spacing:.09em; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
.theme-category-title::after{ content:''; flex:1; height:1px; background:var(--border); }
.theme-options{ grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); gap:14px; }
.theme-opt{
  position:relative; border:1px solid var(--border); border-radius:12px; padding:7px 7px 10px;
  background:var(--bg); cursor:pointer;
  transition:border-color .15s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
}
.theme-opt:hover{ transform:translateY(-2px); border-color:var(--border-strong); box-shadow:0 6px 16px rgba(0,0,0,.08); }
.theme-opt:active{ transform:translateY(0) scale(.985); }
.theme-opt:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.theme-opt.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 6px 16px rgba(0,0,0,.08); }
.theme-swatch{ height:68px; border-radius:8px; margin-bottom:10px; position:relative; }
.theme-opt-label{ font-size:12.5px; padding:0 3px; gap:8px; justify-content:space-between; }
.theme-check{
  width:16px; height:16px; display:grid; place-items:center; order:2;
  background:transparent; border:1.5px solid var(--border-strong);
}
.theme-check svg{ width:10px; height:10px; stroke:var(--accent-text); stroke-width:3.2; fill:none;
  stroke-linecap:round; stroke-linejoin:round; opacity:0; transform:scale(.4);
  transition:opacity .15s var(--ease), transform .2s cubic-bezier(.3,1.6,.5,1); }
.theme-opt.selected .theme-check svg{ opacity:1; transform:scale(1); }

.field-card{
  border:1px solid var(--border); border-radius:12px; background:var(--bg);
  padding:4px 18px;
}
.field-row{ padding:16px 0; gap:24px; }
.field-label{ font-size:14px; font-weight:600; }
.field-sub{ font-size:12.5px; line-height:1.5; margin-top:3px; max-width:38ch; }
.btn-danger{
  height:34px; padding:0 16px; border-radius:8px; font-weight:600; flex-shrink:0;

/* ============================================================================

   ----------------------------------------------------------------------------
   StorageAdapter  – swappable persistence backend (localStorage today;
                      swap for a REST/IndexedDB/CRDT backend later without
                      touching the Store's public API).
   Store           – single source of truth + pub/sub. All mutations go
                      through it. Pages are stored as a flat id->node map
                      (unlimited depth / unlimited siblings, O(1) lookups).
   Router          – tiny view-state machine (page / settings / about / empty).
   ExportRegistry  – pluggable export formats, keyed by scope
                      ('single' | 'tree'). Add a format anywhere by calling
                      ExportRegistry.register(...) — nothing else changes.
   SettingsRegistry– pluggable settings sections, same idea.
   UI              – render functions, one per region of the shell.
   ============================================================================ */

/* ---------------------------------------------------------------------- */
/* Utilities                                                              */
/* ---------------------------------------------------------------------- */
const Util = {
  uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  },
  debounce(fn, ms){
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  },
  escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  },
  stripHtml(html){
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  },
  // Converts editor HTML to plain text while KEEPING line structure:
  // <br>, <p>, <div>, <li>, headings become real newlines; lists get bullets/numbers.
  htmlToText(html){
    const root = document.createElement('div');
    root.innerHTML = html || '';
    const BLOCK = new Set(['P','DIV','H1','H2','H3','H4','H5','H6','LI','BLOCKQUOTE','PRE']);
    let out = '';
    const atLineStart = () => out === '' || out.endsWith('\n');
    const nl = () => { if (!atLineStart()) out += '\n'; };
    (function walk(node, list){
      node.childNodes.forEach(ch => {
        if (ch.nodeType === 3) { out += ch.nodeValue.replace(/\u00a0/g, ' ').replace(/\r/g,''); return; }
        if (ch.nodeType !== 1) return;
        const tag = ch.tagName;
        if (tag === 'BR') { out += '\n'; return; }
        if (tag === 'UL' || tag === 'OL') { nl(); walk(ch, { t: tag, n: 0 }); nl(); return; }
        if (tag === 'LI') {
          nl(); const c = list || { t:'UL', n:0 }; c.n++;
          out += (c.t === 'OL' ? c.n + '. ' : '\u2022 ');
          walk(ch, null); nl(); return;
        }
        if (BLOCK.has(tag)) {
          nl();
          const before = out.length;
          walk(ch, null);
          if (out.length === before) out += '\n';          // empty block = blank line
          else if (!/\n$/.test(out)) out += '\n';

        }
        walk(ch, null);
      });
    })(root, null);
    return out.replace(/[ \t]+$/gm, '').replace(/\n+$/,'');

    const base = (title || 'untitled').toLowerCase().trim()

  },
  formatDate(ts){
    if (!ts) return '';

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);

/* ---------------------------------------------------------------------- */
/* Wave rule — thin, continuously-scrolling wavy line used under headings */
/* ---------------------------------------------------------------------- */
// Draws the wave "tile" (one hump) many times in a row inside a single SVG
// that is TWICE as wide as the visible window, then loops a plain CSS
// `transform: translateX()` on the <svg> element itself, exactly one tile-
// run wide, so the second half seamlessly replaces the first. This works

// internal coordinates equal real CSS pixels 1:1 and there's no ambiguity

// broke the two earlier attempts (a CSS transform on a raw <path>, then a

const WAVE_TILE = 36, WAVE_TILES = 24;      // 24 tiles = 864px total strip

// re-renders, reduced-motion CSS, or power-saving modes on animations.
(function startWaveLoop(){
  const PERIOD = 3600; // ms per loop
  function tick(t){
    const x = -((t % PERIOD) / PERIOD) * (WAVE_TILE * WAVE_TILES / 2);
    document.querySelectorAll('.wave-anim').forEach(el => {
      el.style.transform = `translate3d(${x}px,0,0)`;
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

  let d = '';

  return `<span class="wave-rule"><svg class="wave-svg wave-anim" width="${WAVE_TILE * WAVE_TILES}" height="26" aria-hidden="true">
    <path d="${d.trim()}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

};
function iconEl(name){ const s=document.createElement('span'); s.className='icon'; s.innerHTML=Icons[name]||''; return s; }

/* ---------------------------------------------------------------------- */
/* StorageAdapter — swappable persistence layer                          */
/* ---------------------------------------------------------------------- */
const StorageAdapter = (() => {
  const LEGACY_KEY = 'notion_replica_state_v1';
  const WS_ID = (() => { try { return new URLSearchParams(location.search).get('ws'); } catch (e) { return null; } })();
  const KEY = WS_ID ? 'ws:' + WS_ID : LEGACY_KEY;
  let memoryFallback = null;
  let usingMemory = false;

  function load(){
    try {
      let raw = localStorage.getItem(KEY);
      if (!raw && KEY !== LEGACY_KEY) raw = localStorage.getItem(LEGACY_KEY); // one-time carry-over of old data
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      usingMemory = true;
      return memoryFallback;
    }
  }
  function save(state){
    const raw = JSON.stringify(state);
    if (usingMemory) { memoryFallback = state; return; }
    try {
      localStorage.setItem(KEY, raw);
    } catch (e) {
      usingMemory = true;
      memoryFallback = state;
      try { Toast.show('Browser storage is full — changes are kept only until you close this tab'); } catch (_) {}
    }
  }
  function clear(){
    memoryFallback = null;
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
  return { load, save, clear };
})();

/* ---------------------------------------------------------------------- */
/* Store — single source of truth + pub/sub                              */
/* ---------------------------------------------------------------------- */
const Store = (() => {
  function defaultState(){
    return {
      version: 1,
      theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light',
      rootOrder: [],
      pages: {},         // id -> { id, title, content, type:'page'|'folder', parentId, children:[], createdAt, updatedAt }
      expanded: {},       // id -> bool
      settings: {}         // free-form bag for future SettingsRegistry sections
    };
  }

  let state = StorageAdapter.load() || defaultState();
  // backward/forward-compatible merge in case of future schema additions
  state = Object.assign(defaultState(), state, { pages: state.pages || {}, rootOrder: state.rootOrder || [], expanded: state.expanded || {}, settings: state.settings || {} });

  const listeners = new Set();
  function notify(reason){ listeners.forEach(fn => fn(state, reason)); }
  function subscribe(fn){ listeners.add(fn); return () => listeners.delete(fn); }

  const persist = Util.debounce(() => StorageAdapter.save(state), 250);

  function getState(){ return state; }
  function getPage(id){ return state.pages[id] || null; }
  function getAllPages(){ return Object.values(state.pages); }
  function getChildren(id){
    const list = id ? (state.pages[id] ? state.pages[id].children : []) : state.rootOrder;
    return list.map(cid => state.pages[cid]).filter(Boolean);
  }
  function getAncestors(id){
    const chain = [];
    let cur = state.pages[id];
    while (cur && cur.parentId) {
      cur = state.pages[cur.parentId];
      if (cur) chain.unshift(cur);
    }
    return chain;
  }
  function isDescendant(ancestorId, maybeChildId){
    let cur = state.pages[maybeChildId];
    while (cur && cur.parentId) {
      if (cur.parentId === ancestorId) return true;
      cur = state.pages[cur.parentId];
    }
    return false;
  }

  function createPage(parentId, type){
    const id = Util.uid();
    const now = Date.now();
    state.pages[id] = { id, title:'', content:'', type: type === 'folder' ? 'folder' : 'page', parentId: parentId || null, children:[], createdAt: now, updatedAt: now };
    if (parentId && state.pages[parentId]) {
      state.pages[parentId].children.push(id);
      state.expanded[parentId] = true;
      getAncestors(parentId).forEach(a => { state.expanded[a.id] = true; });
    } else {
      state.rootOrder.push(id);
    }
    persist(); notify('create');
    return id;
  }

  function reorderChildren(parentId, orderedIds){
    if (parentId && state.pages[parentId]) {
      state.pages[parentId].children = orderedIds.slice();
    } else {
      state.rootOrder = orderedIds.slice();
    }
    persist(); notify('reorder');
  }

  function updatePage(id, patch){
    const p = state.pages[id];
    if (!p) return;
    Object.assign(p, patch, { updatedAt: Date.now() });
    persist(); notify('update');
  }

  function deletePage(id){
    const p = state.pages[id];
    if (!p) return [];
    const toDelete = [];
    (function collect(pid){
      toDelete.push(pid);
      const node = state.pages[pid];
      if (node) node.children.forEach(collect);
    })(id);

    if (p.parentId && state.pages[p.parentId]) {
      state.pages[p.parentId].children = state.pages[p.parentId].children.filter(c => c !== id);
    } else {
      state.rootOrder = state.rootOrder.filter(c => c !== id);
    }
    toDelete.forEach(pid => { delete state.pages[pid]; delete state.expanded[pid]; });
    persist(); notify('delete');
    return toDelete;
  }

  function toggleExpanded(id){
    state.expanded[id] = !state.expanded[id];
    persist(); notify('expand');
  }
  function setExpanded(id, val){
    state.expanded[id] = val;
    persist(); notify('expand');
  }
  function expandChain(id){
    const chain = getAncestors(id);
    if (!chain.length) return;
    chain.forEach(a => { state.expanded[a.id] = true; });
    persist(); notify('expand');
  }

  function setTheme(theme){
    state.theme = theme;
    persist(); notify('theme');
  }

  function resetAll(){
    state = defaultState();
    StorageAdapter.clear();
    persist(); notify('reset');
  }

  return {
    subscribe, getState, getPage, getAllPages, getChildren, getAncestors, isDescendant,
    createPage, updatePage, deletePage, reorderChildren, toggleExpanded, setExpanded, expandChain,
    setTheme, resetAll, persist
  };
})();

/* ---------------------------------------------------------------------- */
/* Router — minimal view-state machine                                   */
/* ---------------------------------------------------------------------- */
const Router = (() => {
  let view = { type: 'home' };
  let stack = []; // history of previously-visited views, most recent last
  const listeners = new Set();
  const backListeners = new Set();
  function subscribe(fn){ listeners.add(fn); return () => listeners.delete(fn); }
  function subscribeBack(fn){ backListeners.add(fn); fn(stack.length > 0); return () => backListeners.delete(fn); }
  function sameView(a, b){
    if (!a || !b || a.type !== b.type) return false;
    return a.type === 'page' ? a.pageId === b.pageId : true;
  }
  function emit(){
    listeners.forEach(fn => fn(view));
    backListeners.forEach(fn => fn(stack.length > 0));
  }
  function navigate(next, opts){
    opts = opts || {};
    if (!opts.replace && !sameView(view, next)) stack.push(view);
    view = next;
    emit();
  }
  function back(){
    view = stack.length ? stack.pop() : { type: 'home' };
    emit();
  }
  function canGoBack(){ return stack.length > 0; }
  function current(){ return view; }
  return { subscribe, subscribeBack, navigate, back, canGoBack, current };
})();

/* ---------------------------------------------------------------------- */
/* ExportRegistry — pluggable export formats                             */
/* ---------------------------------------------------------------------- */
const ExportRegistry = (() => {
  const scopes = { single: [], tree: [], all: [] };
  function register(scope, def){ scopes[scope].push(def); }
  function list(scope){ return scopes[scope]; }
  return { register, list };
})();

function buildTreeExportModel(rootId){
  const root = Store.getPage(rootId);
  function walk(page){
    return {
      id: page.id,
      title: page.title || 'Untitled',
      contentHtml: page.content || '',
      children: Store.getChildren(page.id).map(walk)
    };
  }
  return walk(root);
}

function renderTreeHtml(node, depth){
  const childrenHtml = node.children.map(c => renderTreeHtml(c, depth + 1)).join('\n');
  return `<section class="export-page" style="--depth:${depth}">

  <div class="export-content">${node.contentHtml}</div>
  ${node.children.length ? `<div class="export-children">\n${childrenHtml}\n</div>` : ''}
</section>`;
}

// File Mode — the per-file type chosen in the ⋯ menu. Download uses it to
// decide the format/extension of the saved file. Default is txt.
const FILE_MODES = ['pdf','txt','js','css','java','cpp','py','html'];
const DEFAULT_FILE_MODE = 'txt';
function getFileMode(page){
  if (page && FILE_MODES.includes(page.mode)) return page.mode;
  // Files that already hold sub-files (made before modes existed) count as html.
  return (page && page.children && page.children.length) ? 'html' : DEFAULT_FILE_MODE;
}
// Only folders and html-mode files can contain sub-files.
function canHaveSubFiles(page){ return !!page && (page.type === 'folder' || getFileMode(page) === 'html'); }

// Java requires the file name to be a valid class identifier, so build one from the title.
function javaClassName(title){
  const words = (title || 'Main').replace(/[^A-Za-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  let name = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('') || 'Main';
  if (/^[0-9]/.test(name)) name = 'File' + name;
  return name;
}

// Builds the jsPDF document for a page (shared by single download and zip export).
// Picks readable text colour for a page background.
function pdfInkFor(bg){
  const m = /^#?([0-9a-f]{6})$/i.exec(bg || '');
  if (!m) return '#1f1f1e';
  const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) < 140 ? '#f5f5f4' : '#1f1f1e';
}
function hexToRgb(h){ const n = parseInt(h.replace('#',''), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

// Builds the jsPDF document for a page (shared by single download and zip export).
// Honours the page background colour (page.pdfBg) and inline images, in order.
function buildPdfDoc(page){
  if (!window.jspdf) { Toast.show('PDF engine failed to load'); return null; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const marginX = 56, textW = 483;
  const bg = /^#[0-9a-f]{6}$/i.test(page.pdfBg || '') ? page.pdfBg : null;
  const ink = pdfInkFor(bg);
  const paint = () => { if (bg) { doc.setFillColor(...hexToRgb(bg)); doc.rect(0, 0, pageW, pageH, 'F'); } };
  paint();
  doc.setFont('courier', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...hexToRgb(ink));

  // Swap each <img> for a marker line so text and images keep their order.
  const root = document.createElement('div');
  root.innerHTML = page.content || '';
  const imgs = [...root.querySelectorAll('img')];
  imgs.forEach((img, i) => { const m = document.createElement('p'); m.textContent = '\uE000' + i + '\uE001'; img.replaceWith(m); });
  const text = Util.htmlToText(root.innerHTML) || ' ';
  const lines = text.split('\n').flatMap(l => l === '' ? [''] : (/\uE000\d+\uE001/.test(l) ? [l] : doc.splitTextToSize(l.replace(/\t/g,'    '), textW)));

  let y = 72;
  const newPage = () => { doc.addPage(); paint(); y = 72; };
  lines.forEach(line => {
    const mk = /\uE000(\d+)\uE001/.exec(line);
    if (mk) {
      const img = imgs[+mk[1]];
      const src = img && img.getAttribute('src') || '';
      const fmt = /^data:image\/png/i.test(src) ? 'PNG' : /^data:image\/jpe?g/i.test(src) ? 'JPEG' : null;
      if (!fmt) return;
      let w = +img.getAttribute('data-w') || 400, h = +img.getAttribute('data-h') || 300;
      const k = Math.min(textW / w, (pageH - 144) / h, 1);
      w *= k; h *= k;
      if (y + h > pageH - 60) newPage();
      try { doc.addImage(src, fmt, marginX, y, w, h); } catch (e) { console.error(e); }
      y += h + 12;
      return;
    }
    if (y > pageH - 60) newPage();
    doc.text(line, marginX, y);
    y += 16;
  });
  return doc;
}

ExportRegistry.register('single', {
  id: 'txt', ext: 'txt', label: 'Download as .txt', icon: 'download',
  handler(page){
    const text = Util.htmlToText(page.content);

// Guarantees unique names among siblings sharing one zip folder: repeats or
// blank ("untitled") titles get " (2)", " (3)", etc. appended instead of
// silently merging folders together or overwriting each other's files.
function makeUniqueNamer(){
  const used = new Set();
  return function(base){
    let candidate = base, n = 2;
    while (used.has(candidate.toLowerCase())) { candidate = `${base} (${n})`; n++; }
    used.add(candidate.toLowerCase());
    return candidate;
  };
}

// Wraps a single page's HTML content as a standalone, styled document so
// formatting (bold, lists, images, etc.) survives the zip export instead of
// being flattened to plain text.
function buildStandalonePageHtml(page){
  const title = page.title || 'Untitled';
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>${Util.escapeHtml(title)}</title>
<style>${buildExportCss()}</style>
</head>
<body>
<div class="export-root">
<section class="export-page" style="--depth:0">
  <h1 class="export-title">${Util.escapeHtml(title)}</h1>
  <div class="export-content">${page.content || ''}</div>
</section>
</div>
</body>
</html>`;
}

function pageFileContent(page, fmt){
  if (fmt === 'txt') {
    return (Util.htmlToText(page.content) + '\n').replace(/\r?\n/g,'\r\n');
  }
  return buildStandalonePageHtml(page);
}
function buildNestedPageHtml(page){
  const model = buildTreeExportModel(page.id);
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>${Util.escapeHtml(model.title)}</title>
<style>${buildExportCss()}</style>
</head>
<body>
<div class="export-root">
${renderTreeHtml(model, 0)}
</div>
</body>
</html>`;
}
function addPageToZip(zipFolder, page, namer, fmt){
  if (page.type === 'folder') {
    const sub = zipFolder.folder(namer(Util.slugify(page.title)));
    const cn = makeUniqueNamer();
    Store.getChildren(page.id).forEach(c => addPageToZip(sub, c, cn, fmt));
    return;
  }
  // Each file is saved in ITS OWN chosen File Mode (same result as its single download).
  const mode = getFileMode(page);
  if (page.children.length) {
    // File containing sub-files: one nested HTML document.
    zipFolder.file(namer(Util.slugify(page.title)) + '.html', buildNestedPageHtml(page));
    return;
  }
  const base = namer(mode === 'java' ? javaClassName(page.title) : Util.slugify(page.title));
  if (mode === 'pdf') {
    const doc = buildPdfDoc(page);
    if (doc) zipFolder.file(base + '.pdf', doc.output('arraybuffer'));
  } else if (mode === 'txt') {
    zipFolder.file(base + '.txt', (Util.htmlToText(page.content) + '\n').replace(/\r?\n/g, '\r\n'));
  } else {
    zipFolder.file(base + '.' + mode, Util.htmlToText(page.content) + '\n');
  }
}
function saveZip(zip, name){
  return zip.generateAsync({ type:'blob' }).then(blob => Util.downloadBlob(blob, name, 'application/zip'))
    .catch(err => { console.error(err); Toast.show('Could not build the zip — try again'); });
}
function exportBranchZip(pageRef, fmt){
  const page = Store.getPage(pageRef.id);
  if (!page) { Toast.show('This item no longer exists.'); return; }
  if (!window.JSZip) { Toast.show('Zip engine failed to load'); return; }
  const zip = new JSZip();
  addPageToZip(zip, page, makeUniqueNamer(), fmt);
  saveZip(zip, Util.slugify(page.title) + '.zip');
}
function exportFullTreeZip(pageRef, fmt){
  // Whole workspace from the top, every folder/page nested exactly as in the sidebar.
  if (!window.JSZip) { Toast.show('Zip engine failed to load'); return; }
  const zip = new JSZip(), namer = makeUniqueNamer();
  Store.getState().rootOrder.forEach(id => { const p = Store.getPage(id); if (p) addPageToZip(zip, p, namer, fmt); });
  saveZip(zip, 'all-files.zip');
}
[['html','HTML'],['txt','Text']].forEach(([f,n]) => {
  ExportRegistry.register('tree', { id:'zip-'+f, ext:'zip', label:`This branch + children (${n} .zip)`, icon:'folder', handler: p => exportBranchZip(p, f) });
});
[['html','HTML'],['txt','Text']].forEach(([f,n]) => {
  ExportRegistry.register('all', { id:'all-'+f, ext:'zip', label:`Entire workspace tree (${n} .zip)`, icon:'folder', handler: p => exportFullTreeZip(p, f) });
});


/* ---------------------------------------------------------------------- */
/* Toast                                                                  */
/* ---------------------------------------------------------------------- */
const Toast = (() => {
  const el = document.getElementById('toast');
  let t;
  function show(msg){
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(t);
    t = setTimeout(() => el.classList.remove('show'), 2200);
  }
  return { show };
})();

/* ---------------------------------------------------------------------- */
/* Menu — generic positioned popover, supports nested submenus           */
/* ---------------------------------------------------------------------- */
const Menu = (() => {
  const layer = document.getElementById('menu-layer');

  function close(){ layer.innerHTML = ''; document.removeEventListener('mousedown', onDocDown, true); }
  function onDocDown(e){ if (!layer.contains(e.target)) close(); }

  function buildList(items){
    const menu = document.createElement('div');
    menu.className = 'menu';
    items.forEach(item => {
      if (item.type === 'sep') { const s=document.createElement('div'); s.className='menu-sep'; menu.appendChild(s); return; }
      if (item.type === 'info') { const n=document.createElement('div'); n.className='menu-info'; n.textContent=item.label; menu.appendChild(n); return; }
      if (item.type === 'label') { const l=document.createElement('div'); l.className='menu-label'; l.textContent=item.label; menu.appendChild(l); return; }
      const row = document.createElement('div');
      row.className = 'menu-item' + (item.danger ? ' danger' : '');
      const ic = document.createElement('span'); ic.className='icon'; ic.innerHTML = Icons[item.icon] || '';
      const label = document.createElement('span'); label.textContent = item.label;
      row.appendChild(ic); row.appendChild(label);
      if (item.checked) {
        const sp = document.createElement('span'); sp.className='spacer'; row.appendChild(sp);
        const ck = document.createElement('span'); ck.className='icon'; ck.innerHTML = Icons.check || '\u2713'; row.appendChild(ck);
      }
      if (item.submenu) {
        const spacer = document.createElement('span'); spacer.className='spacer'; row.appendChild(spacer);
        const chev = document.createElement('span'); chev.className='icon chev'; chev.innerHTML = Icons.chevron; row.appendChild(chev);
        row.addEventListener('mouseenter', () => openSub(row, item.submenu));
      } else {
        row.addEventListener('click', (e) => { e.stopPropagation(); close(); item.onClick && item.onClick(); });
      }
      menu.appendChild(row);
    });
    return menu;
  }

  function openSub(anchorRow, items){
    layer.querySelectorAll('.menu[data-sub]').forEach(n => n.remove());
    const rect = anchorRow.getBoundingClientRect();
    const sub = buildList(items);
    sub.dataset.sub = '1';
    sub.style.left = (rect.right + 4) + 'px';
    sub.style.top = rect.top + 'px';
    layer.appendChild(sub);
    requestAnimationFrame(() => {
      const sr = sub.getBoundingClientRect();
      if (sr.right > window.innerWidth) sub.style.left = (rect.left - sr.width - 4) + 'px';
      if (sr.bottom > window.innerHeight) sub.style.top = Math.max(8, window.innerHeight - sr.height - 8) + 'px';
    });
  }

  function open(x, y, items){
    close();
    const menu = buildList(items);
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    layer.appendChild(menu);
    requestAnimationFrame(() => {
      const r = menu.getBoundingClientRect();
      if (r.right > window.innerWidth) menu.style.left = Math.max(8, window.innerWidth - r.width - 8) + 'px';
      if (r.bottom > window.innerHeight) menu.style.top = Math.max(8, window.innerHeight - r.height - 8) + 'px';
    });
    setTimeout(() => document.addEventListener('mousedown', onDocDown, true), 0);
  }
  return { open, close };
})();

/* ---------------------------------------------------------------------- */
/* CustomColors — user overrides layered on top of the selected theme     */
/* ---------------------------------------------------------------------- */
const CustomColors = (() => {
  const FIELDS = [
    { key:'bg',            label:'Background' },
    { key:'sidebar',       label:'Sidebar' },
    { key:'text',          label:'Text' },
    { key:'textSecondary', label:'Secondary text' },
    { key:'border',        label:'Borders' },
    { key:'accent',        label:'Accent' }
  ];
  const VAR_FOR = { bg:'--bg', sidebar:'--sidebar-bg', text:'--text', textSecondary:'--text-secondary', border:'--border', accent:'--accent' };
  const ALL_VARS = ['--bg','--bg-raised','--sidebar-bg','--overlay-bg','--text','--text-secondary','--text-tertiary',
    '--border','--border-strong','--hover','--active','--accent','--accent-text','--accent-soft','--scrollbar'];

  const hex2rgb = h => { h = h.replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const rgba = (h, a) => { const [r,g,b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; };
  const toHex = (r,g,b) => '#' + [r,g,b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join('');
  const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return toHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); };
  const lum = h => { const [r,g,b] = hex2rgb(h).map(v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*r + .7152*g + .0722*b; };

  function get(){ return (Store.getState().settings || {}).customColors || null; }

  function clearInline(){ const st = document.documentElement.style; ALL_VARS.forEach(v => st.removeProperty(v)); }

  function apply(){
    clearInline();
    const c = get();
    if (!c) return;
    const st = document.documentElement.style;
    const set = (v, val) => st.setProperty(v, val);
    if (c.bg)      { set('--bg', c.bg); set('--bg-raised', c.bg); set('--overlay-bg', rgba(c.bg, .86)); }
    if (c.sidebar) { set('--sidebar-bg', c.sidebar); }
    if (c.text)    { set('--text', c.text); set('--hover', rgba(c.text, .06)); set('--active', rgba(c.text, .1)); set('--scrollbar', rgba(c.text, .2)); }
    if (c.textSecondary) { set('--text-secondary', c.textSecondary); set('--text-tertiary', c.textSecondary); }
    if (c.border)  { set('--border', c.border); set('--border-strong', mix(c.border, c.text || '#808080', .18)); }
    if (c.accent)  { set('--accent', c.accent); set('--accent-soft', rgba(c.accent, .14)); set('--accent-text', lum(c.accent) > .45 ? '#111111' : '#ffffff'); }
  }

  function setColor(key, value){
    const settings = Store.getState().settings;
    settings.customColors = Object.assign({}, settings.customColors || {}, { [key]: value });
    Store.persist();
    apply();
  }
  function clear(){
    const settings = Store.getState().settings;
    if (settings.customColors) { delete settings.customColors; Store.persist(); }
    apply();
  }

  // Read the colour currently in effect for a CSS variable, as #rrggbb
  function currentHex(cssVar){
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;width:0;height:0;visibility:hidden;background:var(' + cssVar + ')';
    document.body.appendChild(probe);
    const m = getComputedStyle(probe).backgroundColor.match(/[\d.]+/g) || [0,0,0];
    probe.remove();
    return toHex(+m[0], +m[1], +m[2]);
  }

  return { FIELDS, VAR_FOR, apply, setColor, clear, get, currentHex };
})();

const Search = (() => {
  const overlay = document.getElementById('search-overlay');
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');

  function pathLabel(page){
    const chain = Store.getAncestors(page.id);
    return chain.length ? chain.map(p => p.title || 'Untitled').join(' / ') : 'Home';
  }

  function renderResults(query){
    results.innerHTML = '';
    const q = query.trim().toLowerCase();
    if (!q) {
      const empty = document.createElement('div');
      empty.className = 'search-empty';
      empty.textContent = 'Start typing to search file and folder titles…';
      results.appendChild(empty);
      return;
    }
    const matches = Store.getAllPages()
      .filter(p => (p.title || 'Untitled').toLowerCase().includes(q))
      .sort((a, b) => (a.title || '').localeCompare(b.title || ''))
      .slice(0, 50);
    if (!matches.length) {
      const empty = document.createElement('div');
      empty.className = 'search-empty';
      empty.textContent = 'No matching files or folders.';
      results.appendChild(empty);
      return;
    }
    matches.forEach(p => {
      const row = document.createElement('div');
      row.className = 'search-result';
      const isFolder = p.type === 'folder';
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.innerHTML = isFolder ? Icons.folder : Icons.file;
      const main = document.createElement('div');
      main.className = 'search-result-main';
      const title = document.createElement('div');
      title.className = 'search-result-title';
      title.textContent = p.title || 'Untitled';
      const path = document.createElement('div');
      path.className = 'search-result-path';
      path.textContent = pathLabel(p);
      main.appendChild(title); main.appendChild(path);
      const badge = document.createElement('span');
      badge.className = 'type-badge' + (isFolder ? ' is-folder' : '');
      badge.textContent = isFolder ? 'Folder' : 'File';
      row.appendChild(icon); row.appendChild(main); row.appendChild(badge);
      row.addEventListener('click', () => {
        Store.getAncestors(p.id).forEach(a => Store.setExpanded(a.id, true));
        close();
        Router.navigate({ type:'page', pageId: p.id });
      });
      results.appendChild(row);
    });
  }

  function open(){
    input.value = '';
    renderResults('');
    overlay.classList.add('show');
    setTimeout(() => input.focus(), 50);
  }
  function close(){ overlay.classList.remove('show'); }

  input.addEventListener('input', () => renderResults(input.value));
  return { open, close };
})();

/* ---------------------------------------------------------------------- */
/* Upload — files or whole folders into a folder                          */
/* ---------------------------------------------------------------------- */
const UPLOAD_MAX = 2 * 1024 * 1024;
const UPLOAD_EXT_MODE = { html:'html', htm:'html', css:'css', js:'js', mjs:'js', py:'py', cpp:'cpp', cc:'cpp', cxx:'cpp', c:'cpp', h:'cpp', hpp:'cpp', java:'java', pdf:'pdf', txt:'txt' };
const UPLOAD_MODE_LABEL = { html:'HTML', pdf:'PDF', css:'CSS', js:'JavaScript', py:'Python', cpp:'C++', java:'Java', txt:'Plain text' };
const UPLOAD_TEXT_EXT = new Set(['md','json','csv','tsv','xml','svg','yml','yaml','ini','log','sh','ts','tsx','jsx','vue','sql','rb','go','rs','php','cs','kt','swift','toml','cfg','conf','env','bat','tex','rtf']);

function uploadExt(name){ const m = /\.([^.\/]+)$/.exec(name); return m ? m[1].toLowerCase() : ''; }
function uploadGuessMode(name){ return UPLOAD_EXT_MODE[uploadExt(name)] || 'txt'; }
function uploadContentHtml(text){
  const lines = String(text).replace(/\r\n?/g,'\n').replace(/\t/g,'    ').split('\n');
  return lines.map(l => l.length ? `<p>${Util.escapeHtml(l)}</p>` : '<p><br></p>').join('');
}
let pdfjsPromise = null;
function loadPdfJs(){
  if (pdfjsPromise) return pdfjsPromise;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  pdfjsPromise = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = base + 'pdf.min.js';
    sc.onload = async () => {
      try {
        const code = await (await fetch(base + 'pdf.worker.min.js')).text();
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type:'text/javascript' }));
        res(pdfjsLib);
      } catch (e) { rej(e); }
    };
    sc.onerror = rej;
    document.head.appendChild(sc);
  });
  return pdfjsPromise;
}
async function readPdfText(file){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    let line = '', lastY = null;
    tc.items.forEach(it => {
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) { out.push(line); line = ''; }
      line += it.str; lastY = y;
    });
    out.push(line);
    if (i < pdf.numPages) out.push('');
  }
  return out.join('\n');
}
async function readUploadText(entry){
  if (entry.mode === 'pdf' && uploadExt(entry.file.name) === 'pdf') return readPdfText(entry.file);
  return entry.file.text();
}
async function isProbablyText(file){
  const buf = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
  for (let i = 0; i < buf.length; i++) if (buf[i] === 0) return false;
  return true;
}

function pickUploads(parentId, asFolder){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true; inp.hidden = true;
  if (asFolder) inp.webkitdirectory = true;
  inp.addEventListener('change', () => {
    const files = Array.from(inp.files || []);
    inp.remove();
    if (files.length) openUploadDialog(parentId, files);
  });
  document.body.appendChild(inp);
  inp.click();
}

async function openUploadDialog(parentId, files){
  const entries = [];
  let skipped = 0;
  for (const f of files) {
    const ext = uploadExt(f.name);
    const known = !!UPLOAD_EXT_MODE[ext] || UPLOAD_TEXT_EXT.has(ext);
    if (f.size > UPLOAD_MAX || (!known && !(await isProbablyText(f)))) { skipped++; continue; }
    entries.push({ file: f, mode: uploadGuessMode(f.name) });
  }
  if (!entries.length) { Toast.show(skipped ? 'Those files can\'t be imported (binary or over 2 MB).' : 'Nothing to import.'); return; }

  const scrim = document.createElement('div'); scrim.className = 'up-scrim';
  const box = document.createElement('div'); box.className = 'up-box';
  box.innerHTML = `<div class="up-head">Upload ${entries.length} file${entries.length>1?'s':''}</div><div class="up-list"></div><div class="up-foot"><button class="reset btn btn-outline" data-x="cancel">Cancel</button><button class="reset btn btn-primary" data-x="go">Upload</button></div>`;
  const list = box.querySelector('.up-list');
  entries.forEach(en => {
    const row = document.createElement('div'); row.className = 'up-row';
    const nm = document.createElement('div'); nm.className = 'up-name';
    nm.textContent = en.file.webkitRelativePath || en.file.name;
    const sz = document.createElement('div'); sz.className = 'up-size';
    sz.textContent = en.file.size > 1024 ? Math.round(en.file.size/1024) + ' KB' : en.file.size + ' B';
    const sel = document.createElement('select'); sel.className = 'up-sel';
    Object.keys(UPLOAD_MODE_LABEL).forEach(m => {
      const o = document.createElement('option'); o.value = m; o.textContent = '.' + m + ' — ' + UPLOAD_MODE_LABEL[m];
      if (m === en.mode) o.selected = true; sel.appendChild(o);
    });
    sel.addEventListener('change', () => { en.mode = sel.value; });
    row.append(nm, sz, sel); list.appendChild(row);
  });
  scrim.appendChild(box); document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
  box.querySelector('[data-x="cancel"]').addEventListener('click', close);
  box.querySelector('[data-x="go"]').addEventListener('click', async () => {
    const goBtn = box.querySelector('[data-x="go"]'); goBtn.disabled = true; goBtn.textContent = 'Uploading…';
    const folderCache = {};
    const folderFor = (parts) => {
      let pid = parentId, key = '';
      parts.forEach(seg => {
        key += '/' + seg;
        if (!folderCache[key]) {
          const id = Store.createPage(pid, 'folder');
          Store.updatePage(id, { title: seg });
          folderCache[key] = id;
        }
        pid = folderCache[key];
      });
      return pid;
    };
    let ok = 0, fail = 0, last = null;
    for (const en of entries) {
      try {
        const rel = (en.file.webkitRelativePath || '').split('/').filter(Boolean);
        const parts = rel.length > 1 ? rel.slice(0, -1) : [];
        const text = await readUploadText(en);
        const pid = folderFor(parts);
        const id = Store.createPage(pid, 'page');
        const hasKnown = !!UPLOAD_EXT_MODE[uploadExt(en.file.name)];
        const title = hasKnown ? en.file.name.replace(/\.[^.]+$/, '') : en.file.name;
        Store.updatePage(id, { title, mode: en.mode, content: uploadContentHtml(text) });
        last = id; ok++;
      } catch (e) { fail++; }
    }
    close();
    Store.setExpanded(parentId, true);
    renderSidebar();
    if (Router.current().type === 'page' && Router.current().pageId === parentId) renderPageView(parentId);
    Toast.show(`Uploaded ${ok} file${ok===1?'':'s'}` + (fail + skipped ? ` · ${fail + skipped} skipped` : ''));
    if (ok === 1 && last) Router.navigate({ type:'page', pageId: last });
  });
}

function downloadMenuItems(page){
  const items = [];
  const has = page.children.length > 0;
  if (page.type === 'folder') {
    items.push({ type:'label', label:'This folder' });
    ExportRegistry.list('tree').filter(f => f.id === 'zip-html').forEach(fmt =>
      items.push({ label:'Folder + everything inside (.zip)', icon: fmt.icon, onClick: () => fmt.handler(page) }));
  } else if (has) {
    // Page containing pages: one HTML document with pages nested inside pages.
    items.push({ type:'label', label:'File with sub-files' });
    ExportRegistry.list('tree').filter(f => f.id === 'html').forEach(fmt =>
      items.push({ label:'HTML (.html) — files inside file', icon: fmt.icon, onClick: () => fmt.handler(page) }));
  } else {
    // One entry, in the format of the file's chosen File Mode (change it in ⋯ → File Mode).
    items.push({ type:'label', label:'This file' });
    const mode = getFileMode(page);
    const all = ExportRegistry.list('single');
    all.filter(f => f.id === mode).forEach(fmt =>
      items.push({ label: fmt.label, icon: fmt.icon, onClick: () => fmt.handler(page) }));
    items.push({ type:'label', label:'Export as…' });
    all.filter(f => f.id !== mode).forEach(fmt =>
      items.push({ label: fmt.label.replace('Download as ', ''), icon: fmt.icon, onClick: () => fmt.handler(page) }));
  }
  items.push({ type:'sep' });
  items.push({ type:'label', label:'Everything from the top' });
  ExportRegistry.list('all').filter(f => f.id === 'all-html').forEach(fmt =>
    items.push({ label:'Entire workspace (.zip)', icon: fmt.icon, onClick: () => fmt.handler(page) }));
  return items;
}

function openRowMenu(x, y, pageRef){

  const items = [
    ...(canHaveSubFiles(page) ? [{ label: page.type === 'folder' ? 'Add file' : 'Add sub-file', icon:'file', onClick: () => {
        const id = Store.createPage(page.id, 'page');
        Store.setExpanded(page.id, true);
        Router.navigate({ type:'page', pageId: id });
      } }] : []),
    ...(page.type === 'folder' ? [{ label:'Add sub-folder', icon:'folder', onClick: () => {
        const id = Store.createPage(page.id, 'folder');
        Store.setExpanded(page.id, true);
        Router.navigate({ type:'page', pageId: id });
      } }] : []),
    ...(page.type === 'folder' ? uploadMenuItems(page) : []),

        Router.navigate({ type:'page', pageId: page.id });
        setTimeout(() => {
          const t = document.querySelector('.editor-title') || document.querySelector('.gallery-title');
          if (t) { t.focus(); placeCaretEnd(t); }

      } },

        FILE_MODES.map(m => ({
          label: m, icon:'file', checked: getFileMode(page) === m,
          onClick: () => {
            const fresh = Store.getPage(page.id);
            if (m !== 'html' && fresh && fresh.children.length) {
              Toast.show('Only html files can have sub-files — remove them first.');
              return;
            }

    ] : []),
    { label:'Download', icon:'download', submenu: downloadMenuItems(page) },

          }
          renderSidebar();
        }
      } }
  ];
  Menu.open(x, y, items);
}

function buildTreeRow(page, depth){
  const node = document.createElement('div');
  node.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'tree-row';
  row.style.paddingLeft = (6 + Math.min(depth, 14) * 14) + 'px';
  const cur = Router.current();
  if (cur.type === 'page' && cur.pageId === page.id) row.classList.add('active');

  const hasChildren = page.children.length > 0;
  const expanded = !!Store.getState().expanded[page.id];

  const toggle = document.createElement('button');
  toggle.className = 'reset tree-toggle' + (hasChildren ? (expanded ? ' expanded' : '') : ' leaf');
  toggle.innerHTML = Icons.chevron;
  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!hasChildren) return;
    Store.toggleExpanded(page.id);
    renderSidebar();
  });

  const typeIcon = document.createElement('span');
  typeIcon.className = 'icon tree-type-icon';
  typeIcon.innerHTML = page.type === 'folder' ? Icons.folder : Icons.file;

  const label = document.createElement('div');
  label.className = 'tree-label' + (page.title ? '' : ' untitled');
  label.id = 'tree-label-' + page.id;
  label.textContent = page.title || 'Untitled';

  const actions = document.createElement('div');
  actions.className = 'tree-actions';

  const addBtn = document.createElement('button');
  addBtn.className = 'reset icon-btn'; addBtn.title = 'Add file or folder';
  addBtn.innerHTML = Icons.plus;
  addBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = addBtn.getBoundingClientRect();
    openNewMenu(r.left, r.bottom + 4, page.id);
  });

  const moreBtn = document.createElement('button');
  moreBtn.className = 'reset icon-btn'; moreBtn.title = 'More';
  moreBtn.innerHTML = Icons.dots;
  moreBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = moreBtn.getBoundingClientRect();
    openRowMenu(r.left, r.bottom + 4, page);
  });

  if (canHaveSubFiles(page)) actions.appendChild(addBtn);
  actions.appendChild(moreBtn);
  row.appendChild(toggle);
  row.appendChild(typeIcon);
  row.appendChild(label);
  row.appendChild(actions);
  row.addEventListener('click', () => { Router.navigate({ type:'page', pageId: page.id }); closeSidebarMobile(); });

  node.appendChild(row);

  const childrenWrap = document.createElement('div');
  childrenWrap.className = 'tree-children' + (expanded ? ' expanded' : '');
  const inner = document.createElement('div');
  inner.className = 'tree-children-inner';
  if (hasChildren) {
    Store.getChildren(page.id).forEach(child => inner.appendChild(buildTreeRow(child, depth + 1)));
  }
  childrenWrap.appendChild(inner);
  node.appendChild(childrenWrap);

  return node;
}

let _treeAnimTimer = 0;
function renderSidebar(){
  const roots = Store.getChildren(null);
  const prevTop = treeEl.scrollTop, prevLeft = treeEl.scrollLeft;
  treeEl.classList.add('no-anim');
  clearTimeout(_treeAnimTimer);
  treeEl.innerHTML = '';
  if (!roots.length) {
    const empty = document.createElement('div');
    empty.className = 'tree-empty';
    empty.textContent = 'No files yet';
    treeEl.appendChild(empty);
    treeEl.classList.remove('no-anim');
    return;
  }
  roots.forEach(page => treeEl.appendChild(buildTreeRow(page, 0)));
  treeEl.scrollTop = prevTop; treeEl.scrollLeft = prevLeft;
  requestAnimationFrame(() => requestAnimationFrame(() => { _treeAnimTimer = setTimeout(() => treeEl.classList.remove('no-anim'), 30); }));
}

  } else if (AboutNav[view.type]) {
