function countChars(html){
  const t = Util.htmlToText(html || '');
  return { all: Array.from(t).length, noSpaces: Array.from(t.replace(/\s/g, '')).length };
}
let activeFinder = null; // set by renderPageView for the file currently open
function charStatsFor(page){
  // Use the live editor when this file is open (saves are debounced), otherwise the stored content.
  if (activeFinder && activeFinder.pageId === page.id && activeFinder.isAlive()) return countChars(activeFinder.getHtml());
  return countChars(page.content);
}
function openFinderFor(pageId){
  const open = () => { if (activeFinder && activeFinder.pageId === pageId && activeFinder.isAlive()) activeFinder.open(); };
  const cur = Router.current();
  if (cur.type === 'page' && cur.pageId === pageId) { open(); return; }
  Router.navigate({ type:'page', pageId });
  setTimeout(open, 260);
}

function createFinder(view, titleEl, contentEl, pageId){
  const HL = (typeof CSS !== 'undefined' && CSS.highlights && typeof Highlight !== 'undefined') ? CSS.highlights : null;
  const bar = document.createElement('div');
  bar.className = 'find-bar'; bar.hidden = true;
  bar.innerHTML = `
    <div class="find-input-wrap">
      <span class="icon">${Icons.search}</span>
      <input class="find-input" type="text" placeholder="Find in this file…" autocomplete="off" spellcheck="false" aria-label="Find in file">
      <span class="find-count" aria-live="polite"></span>
    </div>
    <button class="reset icon-btn find-case" title="Match case" aria-label="Match case">Aa</button>
    <button class="reset icon-btn find-prev" title="Previous (Shift+Enter)" aria-label="Previous match"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></span></button>
    <button class="reset icon-btn find-next" title="Next (Enter)" aria-label="Next match"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button>
    <button class="reset icon-btn find-close" title="Close (Esc)" aria-label="Close find"><span class="icon">${Icons.x || '×'}</span></button>`;
  view.insertBefore(bar, view.firstChild);

  const input = bar.querySelector('.find-input');
  const countEl = bar.querySelector('.find-count');
  const caseBtn = bar.querySelector('.find-case');
  let matchCase = false, ranges = [], idx = -1;

  function collect(root){
    // Concatenate text nodes; insert a virtual newline between blocks so matches never span paragraphs.
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; let text = '', prevBlock = null, n;
    while ((n = walker.nextNode())) {
      const block = n.parentElement && n.parentElement.closest('p,div,li,h1,h2,h3,h4,h5,h6,blockquote,pre');
      if (nodes.length && block !== prevBlock) text += '\n';
      nodes.push({ node:n, start:text.length });
      text += n.nodeValue; prevBlock = block;
    }
    return { nodes, text };
  }
  function locate(nodes, pos){
    for (let i = nodes.length - 1; i >= 0; i--) if (pos >= nodes[i].start) return { node:nodes[i].node, off: pos - nodes[i].start };
    return null;
  }
  function findIn(root, re, out){
    const { nodes, text } = collect(root);
    re.lastIndex = 0; let m;
    while ((m = re.exec(text))) {
      if (!m[0].length) { re.lastIndex++; continue; }
      const a = locate(nodes, m.index), e = locate(nodes, m.index + m[0].length - 1);
      if (!a || !e) continue;
      const r = document.createRange();
      r.setStart(a.node, a.off);
      r.setEnd(e.node, Math.min(e.node.nodeValue.length, e.off + 1));
      out.push(r);
    }
  }
  function paint(){
    if (HL) {
      HL.delete('find-match'); HL.delete('find-current');
      if (ranges.length) {
        HL.set('find-match', new Highlight(...ranges));
        if (idx >= 0) HL.set('find-current', new Highlight(ranges[idx]));
      }
    } else if (idx >= 0) {
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(ranges[idx]);
    }
  }
  function updateCount(){
    const q = input.value;
    countEl.classList.toggle('none', !!q && !ranges.length);
    countEl.textContent = !q ? '' : (ranges.length ? `${idx + 1} of ${ranges.length}` : 'No results');
  }
  function reveal(){
    if (idx < 0) return;
    const el = ranges[idx].startContainer.parentElement;
    if (el) el.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  function run(keepIdx){
    const q = input.value;
    ranges = [];
    if (q) {
      const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), matchCase ? 'g' : 'gi');
      findIn(titleEl, re, ranges);
      if (contentEl) findIn(contentEl, re, ranges);
    }
    idx = ranges.length ? (keepIdx && idx >= 0 ? Math.min(idx, ranges.length - 1) : 0) : -1;
    paint(); updateCount();
    if (!keepIdx) reveal();
  }
  function step(d){
    if (!ranges.length) return;
    idx = (idx + d + ranges.length) % ranges.length;
    paint(); updateCount(); reveal();
  }
  function clear(){
    if (HL) { HL.delete('find-match'); HL.delete('find-current'); }
    ranges = []; idx = -1;
  }

  input.addEventListener('input', () => run(false));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); api.close(); }
  });
  caseBtn.addEventListener('click', () => { matchCase = !matchCase; caseBtn.classList.toggle('active', matchCase); run(false); input.focus(); });
  bar.querySelector('.find-prev').addEventListener('click', () => step(-1));
  bar.querySelector('.find-next').addEventListener('click', () => step(1));
  bar.querySelector('.find-close').addEventListener('click', () => api.close());

  // Keep results in sync while the file is being edited.
  const refresh = Util.debounce(() => { if (!bar.hidden && input.value) run(true); }, 200);
  if (contentEl) contentEl.addEventListener('input', refresh);
  titleEl.addEventListener('input', refresh);

  const api = {
    pageId,
    isAlive: () => view.isConnected,
    getHtml: () => (contentEl ? contentEl.innerHTML : ''),
    open(){
      bar.hidden = false; input.focus(); input.select();
      if (input.value) run(false);
    },
    close(){ bar.hidden = true; clear(); updateCount(); },
    destroy(){ clear(); }
  };
  return api;
}

  const isFolder = page.type === 'folder';

      ${isFolder ? '' : `<div class="editor-toolbar" id="editor-toolbar">
        <button class="reset tb-btn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button class="reset tb-btn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button class="reset tb-btn" data-cmd="underline" title="Underline"><u>U</u></button>
        <button class="reset tb-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>

        <button class="reset tb-btn" data-block="h2" title="Heading">H</button>
        <button class="reset tb-btn" data-cmd="insertUnorderedList" title="Bulleted list">&bull;</button>
        <button class="reset tb-btn" data-cmd="insertOrderedList" title="Numbered list">1.</button>
      </div>
      ${getFileMode(page) === 'pdf' ? `<div class="pdf-tools" id="pdf-tools">
        <div class="pdf-tools-group"><span class="pdf-tools-label">Page color</span>
          <button class="reset pdf-swatch none" data-bg="" title="Default"></button>
          <button class="reset pdf-swatch" data-bg="#ffffff" style="background:#ffffff" title="White"></button>
          <button class="reset pdf-swatch" data-bg="#fdf6e3" style="background:#fdf6e3" title="Cream"></button>
          <button class="reset pdf-swatch" data-bg="#e8f1fd" style="background:#e8f1fd" title="Sky"></button>
          <button class="reset pdf-swatch" data-bg="#e9f7ec" style="background:#e9f7ec" title="Mint"></button>
          <button class="reset pdf-swatch" data-bg="#fdeaf1" style="background:#fdeaf1" title="Blush"></button>
          <button class="reset pdf-swatch" data-bg="#1c1c1e" style="background:#1c1c1e" title="Charcoal"></button>
          <input type="color" class="pdf-color-input" id="pdf-color-input" title="Custom color" value="#ffffff">
        </div>
        <div class="pdf-tools-group">
          <button class="reset pdf-btn" id="pdf-add-image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="M21 16l-5-5-9 9"/></svg>Add image</button>
          <input type="file" id="pdf-image-input" accept="image/*" multiple hidden>
        </div>
        <span class="pdf-spacer"></span>
        <span class="pdf-status" id="pdf-status">Saved</span>
        <button class="reset pdf-btn primary" id="pdf-download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>Download PDF</button>
      </div>` : ''}
      <div class="editor-content${getFileMode(page) === 'pdf' ? ' pdf-paper' : ''}" contenteditable="true" data-placeholder="Write something…" spellcheck="false"></div>`}
      <div id="subpages-slot"></div>
    </div>`;
  viewPort.appendChild(view);

  const titleEl = view.querySelector('.editor-title');
  const contentEl = view.querySelector('.editor-content');
  titleEl.textContent = page.title || '';
  if (contentEl) contentEl.innerHTML = page.content || '';

  const saveTitle = Util.debounce(() => {
    Store.updatePage(page.id, { title: titleEl.textContent.trim() });
    renderBreadcrumb();
  }, 300);
  const saveContent = Util.debounce(() => {
    if (contentEl) Store.updatePage(page.id, { content: contentEl.innerHTML });
  }, 300);

  titleEl.addEventListener('input', () => {
    const labelEl = document.getElementById('tree-label-' + page.id);
    if (labelEl) {
      labelEl.textContent = titleEl.textContent.trim() || 'Untitled';
      labelEl.classList.toggle('untitled', !titleEl.textContent.trim());
    }
    saveTitle();
  });
  titleEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); if (contentEl) contentEl.focus(); else titleEl.blur(); }
  });
  if (contentEl) {
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch(e){}
  contentEl.addEventListener('paste', (e) => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\r\n?/g, '\n');
    const html = t.split('\n').map(l => l.length ? `<p>${Util.escapeHtml(l)}</p>` : '<p><br></p>').join('');
    document.execCommand('insertHTML', false, html);
  });
  contentEl.addEventListener('input', saveContent);
  contentEl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
  });

  view.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      contentEl.focus();
      document.execCommand(btn.dataset.cmd, false, null);
      saveContent();
    });
  });
  view.querySelectorAll('[data-block]').forEach(btn => {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      contentEl.focus();
      document.execCommand('formatBlock', false, btn.dataset.block);
      saveContent();
    });
  });

  }

  // ---- PDF-only tools: page colour, images, download ----
  const pdfTools = view.querySelector('#pdf-tools');
  if (pdfTools && contentEl) {
    const statusEl = pdfTools.querySelector('#pdf-status');
    const colorIn = pdfTools.querySelector('#pdf-color-input');
    let statusT;
    const flash = (t) => { statusEl.textContent = t; clearTimeout(statusT); statusT = setTimeout(() => statusEl.textContent = 'Saved', 1400); };
    const applyBg = (bg) => {
      contentEl.style.background = bg || '';
      contentEl.style.color = bg ? pdfInkFor(bg) : '';
      pdfTools.querySelectorAll('.pdf-swatch').forEach(b => b.classList.toggle('active', (b.dataset.bg || '') === (bg || '')));
      if (bg) colorIn.value = bg;
    };
    const cur = Store.getPage(page.id);
    applyBg(cur && cur.pdfBg || '');
    const setBg = (bg) => { applyBg(bg); Store.updatePage(page.id, { pdfBg: bg || null }); flash('Saved'); };
    pdfTools.querySelectorAll('.pdf-swatch').forEach(b => b.addEventListener('click', () => setBg(b.dataset.bg)));
    colorIn.addEventListener('input', () => setBg(colorIn.value));

    // Downscale so pages stay small enough to store; keep PNG for transparency.
    const readImage = (file) => new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = () => {
        const im = new Image();
        im.onerror = reject;
        im.onload = () => {
          const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
          const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          const keepAlpha = /png|gif|webp|svg/i.test(file.type);
          if (!keepAlpha) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
          ctx.drawImage(im, 0, 0, w, h);
          resolve({ src: c.toDataURL(keepAlpha ? 'image/png' : 'image/jpeg', 0.85), w, h });
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
    const fileIn = pdfTools.querySelector('#pdf-image-input');
    pdfTools.querySelector('#pdf-add-image').addEventListener('click', () => fileIn.click());
    fileIn.addEventListener('change', async () => {
      const files = [...fileIn.files].filter(f => f.type.startsWith('image/'));
      fileIn.value = '';
      if (!files.length) return;
      flash('Adding…');
      contentEl.focus();
      for (const f of files) {
        try {
          const { src, w, h } = await readImage(f);
          document.execCommand('insertHTML', false, `<img src="${src}" data-w="${w}" data-h="${h}" alt=""><p><br></p>`);
        } catch (e) { Toast.show('Could not read ' + f.name); }
      }
      saveContent();
      flash('Image added & saved');
    });

    // Click an image to select it; Delete/Backspace removes it.
    let selImg = null;
    const clearSel = () => { if (selImg) selImg.classList.remove('img-selected'); selImg = null; };
    contentEl.addEventListener('click', (e) => {
      clearSel();
      if (e.target.tagName === 'IMG') { selImg = e.target; selImg.classList.add('img-selected'); }
    });
    contentEl.addEventListener('keydown', (e) => {
      if (selImg && (e.key === 'Delete' || e.key === 'Backspace')) {
        e.preventDefault(); selImg.remove(); selImg = null; saveContent(); flash('Image removed');
      }
    });
    contentEl.addEventListener('input', () => { statusEl.textContent = 'Saving…'; setTimeout(() => flash('Saved'), 450); });

    pdfTools.querySelector('#pdf-download').addEventListener('click', () => {
      const latest = Store.getPage(page.id);
      // Make sure the newest edits are included.
      Store.updatePage(page.id, { content: contentEl.innerHTML });
      const doc = buildPdfDoc(Store.getPage(page.id) || latest);
      if (doc) doc.save(`${Util.slugify(page.title)}.pdf`);
    });
  }

  if (contentEl) activeFinder = createFinder(view, titleEl, contentEl, page.id);

  if (!page.title && !page.content) setTimeout(() => placeCaretEnd(titleEl), 50);

  const slot = view.querySelector('#subpages-slot');
  if (isFolder) renderFolderChildrenGallery(slot, page);
  else renderSubpagesList(slot, page);
}

/* ---------------------------------------------------------------------- */
/* Inline sub-page list — shown beneath a page's content, Notion-style   */
/* ---------------------------------------------------------------------- */
function renderSubpagesList(slot, page){
  slot.innerHTML = '';
  const children = Store.getChildren(page.id);
  if (!children.length) return;

  const section = document.createElement('div');
  section.className = 'subpages-section';

  const label = document.createElement('div');
  label.className = 'subpages-label';
  label.textContent = children.length === 1 ? '1 sub-file' : `${children.length} sub-files`;
  section.appendChild(label);

  children.forEach(child => {
    const row = document.createElement('div');
    row.className = 'subpage-link';
    const isFolder = child.type === 'folder';

    const icon = document.createElement('span');
    icon.className = 'icon subpage-link-icon' + (isFolder ? ' is-folder' : '');
    icon.innerHTML = isFolder ? Icons.folder : Icons.file;

    const title = document.createElement('span');
    title.className = 'subpage-link-title' + (child.title ? '' : ' untitled');
    title.textContent = child.title || 'Untitled';

    const badge = document.createElement('span');
    badge.className = 'type-badge' + (isFolder ? ' is-folder' : '');
    badge.textContent = isFolder ? 'Folder' : 'File';

    const moreBtn = document.createElement('button');
    moreBtn.className = 'reset icon-btn subpage-link-more'; moreBtn.title = 'More — includes Download';
    moreBtn.innerHTML = Icons.dots;
    moreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const r = moreBtn.getBoundingClientRect();
      openRowMenu(r.right - 200, r.bottom + 4, child);
    });

    row.appendChild(icon);
    row.appendChild(title);
    row.appendChild(badge);
    row.appendChild(moreBtn);
    row.addEventListener('click', () => Router.navigate({ type:'page', pageId: child.id }));
    section.appendChild(row);
  });

  slot.appendChild(section);
}

/* ---------------------------------------------------------------------- */
/* Folder gallery — shared between Home (root) and folder-type pages     */
/* ---------------------------------------------------------------------- */
function buildGalleryCard(childPage, parentId, orderedIds){
  const card = document.createElement('div');
  card.className = 'gallery-card';
  card.draggable = true;
  card.dataset.id = childPage.id;
  const isFolder = childPage.type === 'folder';

  const top = document.createElement('div');
  top.className = 'gallery-card-top';
  const icon = document.createElement('span');
  icon.className = 'icon gallery-card-icon' + (isFolder ? ' is-folder' : '');
  icon.innerHTML = isFolder ? Icons.folder : Icons.file;
  const badge = document.createElement('span');
  badge.className = 'type-badge' + (isFolder ? ' is-folder' : '');
  badge.textContent = isFolder ? 'Folder' : 'File';
  const moreBtn = document.createElement('button');
  moreBtn.className = 'reset icon-btn gallery-card-more'; moreBtn.title = 'More — includes Download';
  moreBtn.innerHTML = Icons.dots;
  moreBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = moreBtn.getBoundingClientRect();
    openRowMenu(r.right - 200, r.bottom + 4, childPage);
  });
  top.appendChild(icon);
  top.appendChild(badge);
  top.appendChild(moreBtn);

  const title = document.createElement('div');
  title.className = 'gallery-card-title' + (childPage.title ? '' : ' untitled');
  title.textContent = childPage.title || 'Untitled';

  card.appendChild(top);
  card.appendChild(title);

  if (isFolder) {
    const meta = document.createElement('div');
    const count = childPage.children.length;
    meta.className = 'gallery-card-meta';
    meta.textContent = count === 1 ? '1 item' : `${count} items`;
    card.appendChild(meta);
  } else if (childPage.content) {
    const preview = document.createElement('div');
    preview.className = 'gallery-card-preview';
    preview.textContent = Util.htmlToText(childPage.content).replace(/\s+/g, ' ').slice(0, 140);
    card.appendChild(preview);
  }

  card.addEventListener('click', () => Router.navigate({ type:'page', pageId: childPage.id }));

  // Simple drag-to-reorder so users can visually organize cards within a folder/Home.
  card.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', childPage.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drag-over'); });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
  card.addEventListener('drop', (e) => {
    e.preventDefault();
    card.classList.remove('drag-over');
    const draggedId = e.dataTransfer.getData('text/plain');
    if (!draggedId || draggedId === childPage.id) return;
    const order = orderedIds.slice();
    const from = order.indexOf(draggedId);
    const to = order.indexOf(childPage.id);
    if (from === -1 || to === -1) return;
    order.splice(from, 1);
    order.splice(to, 0, draggedId);
    Store.reorderChildren(parentId, order);
    renderCurrentView();
  });

  return card;
}

function buildGalleryGrid(parentId, children){
  const grid = document.createElement('div');
  grid.className = 'gallery-grid';
  if (!children.length) {
    const empty = document.createElement('div');
    empty.className = 'gallery-empty';
    empty.textContent = 'Nothing here yet. Use "New" to add a file or a folder.';
    grid.appendChild(empty);
    return grid;
  }
  const orderedIds = children.map(c => c.id);
  children.forEach(child => grid.appendChild(buildGalleryCard(child, parentId, orderedIds)));
  return grid;
}

function renderFolderChildrenGallery(slot, page){
  slot.innerHTML = '';
  const children = Store.getChildren(page.id);

  const section = document.createElement('div');
  section.className = 'subpages-section';

  const label = document.createElement('div');
  label.className = 'subpages-label';
  label.textContent = !children.length ? 'Contents' : (children.length === 1 ? '1 item' : `${children.length} items`);
  section.appendChild(label);
  section.appendChild(buildGalleryGrid(page.id, children));

  slot.appendChild(section);
}

function renderHomeView(){
  viewPort.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'view';
  view.innerHTML = `
    <div class="gallery-wrap">
      <div class="masthead">
        <h1 class="masthead-title">Textualistic</h1>
        ${buildWaveSvg()}
      </div>
      <div class="gallery-header">
        <div class="gallery-title">Home</div>
      </div>
      <div class="gallery-sub">All your top-level files and folders</div>
      <div id="gallery-grid-slot"></div>
    </div>`;
  viewPort.appendChild(view);
  const children = Store.getChildren(null);
  view.querySelector('#gallery-grid-slot').appendChild(buildGalleryGrid(null, children));
}

/* ---------------------------------------------------------------------- */
/* About — static info pages (About, Connect With Us, and its sub-pages)  */
/* ---------------------------------------------------------------------- */
// Parent/title map used to build breadcrumbs and to know what "back"
// conceptually leads to; navigation itself still goes through Router so the
// same push/pop history behaves consistently with the rest of the app.
const AboutNav = {
  'about':            { title: 'About',                       parent: null },
  'about-connect':    { title: 'Connect With Us',              parent: 'about' },
  'about-digital':    { title: 'Digital Media Identities Under Textualistic',parent: 'about-connect' },
  'about-website':    { title: 'Website',                      parent: 'about-digital' },
  'about-contact':    { title: 'Contact Us',                   parent: 'about-digital' },
  'about-profiles':   { title: 'Digital Media Profiles',       parent: 'about-digital' },
  'about-youtube':    { title: 'YouTube',                      parent: 'about-profiles' },
  'about-instagram':  { title: 'Instagram',                    parent: 'about-profiles' },
  'about-x':          { title: 'X',                            parent: 'about-profiles' }
};

// A static (non-Store-backed) folder card, styled identically to the real
// gallery folder cards elsewhere in the app (blue icon + badge) so these
// info-section links look like part of the same folder system.
function buildStaticFolderCard(label, onClick){
  const card = document.createElement('div');
  card.className = 'gallery-card static-folder-card';
  card.setAttribute('role', 'button');
  card.tabIndex = 0;
  const top = document.createElement('div');
  top.className = 'gallery-card-top';
  const icon = document.createElement('span');
  icon.className = 'icon gallery-card-icon is-folder';
  icon.innerHTML = Icons.folder;
  const badge = document.createElement('span');
  badge.className = 'type-badge is-folder';
  badge.textContent = 'Folder';
  top.appendChild(icon);
  top.appendChild(badge);
  const title = document.createElement('div');
  title.className = 'gallery-card-title';
  title.textContent = label;
  card.appendChild(top);
  card.appendChild(title);
  card.addEventListener('click', onClick);
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); }
  });
  return card;
}

function buildAboutBackButton(){
  const btn = document.createElement('button');
  btn.className = 'reset btn btn-outline about-back';
  btn.innerHTML = `<span class="icon">${Icons.back}</span><span>Back</span>`;
  btn.addEventListener('click', () => Router.back());
  return btn;
}

function renderAboutView(){
  viewPort.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'view';
  view.innerHTML = `
    <div class="about-wrap">
      <h1 class="about-heading">Textualistic</h1>
      ${buildWaveSvg()}
      <p class="about-text">Textualistic, a project for storing texts, downloading texts in various formats, organizing texts, organizing textual files, creating sub-text files, organizing files into folders, creating sub-folders, and exporting.</p>
      <p class="about-text">Various formats are available, including PDF, TXT, ZIP (for folders), and HTML.</p>
      <p class="about-text">Textualistic is a project under <a class="about-link" href="https://hnx.github.io/Instrumentorum" target="_blank" rel="noopener noreferrer">Instrumentorum</a>.</p>
      <div class="about-section-heading">Connect With Us</div>
      <div class="about-folder-grid" id="about-connect-slot"></div>
    </div>`;
  viewPort.appendChild(view);
  const wrap = view.querySelector('.about-wrap');
  wrap.querySelector('#about-connect-slot').appendChild(
    buildStaticFolderCard('CONNECT WITH US', () => Router.navigate({ type: 'about-connect' }))
  );
  wrap.appendChild(buildAboutBackButton());
}

// Handles every "Connect With Us" sub-page. Each is otherwise blank —
// just the folders or text the spec calls for, plus Back — so the
// hierarchy reads through the breadcrumb rather than repeated headings.
function renderAboutSubView(type){
  viewPort.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'view';
  const wrap = document.createElement('div');
  wrap.className = 'about-wrap';
  view.appendChild(wrap);
  viewPort.appendChild(view);

  const folderLinks = {
    'about-connect': [
      ['Digital Media Identities Under Textualistic', 'about-digital']
    ],
    'about-digital': [
      ['Website', 'about-website'],
      ['Contact Us', 'about-contact'],
      ['Digital Media Profiles', 'about-profiles']
    ],
    'about-profiles': [
      ['YouTube', 'about-youtube'],
      ['Instagram', 'about-instagram'],
      ['X', 'about-x']
    ]
  };
  const leafText = {
    'about-youtube': 'YouTube.com/@Textualistic',
    'about-instagram': 'Instagram.com/Textualistic',
    'about-x': 'X.com/Textualistic'
  };

  if (folderLinks[type]) {
    const grid = document.createElement('div');
    grid.className = 'about-folder-grid';
    folderLinks[type].forEach(([label, target]) => {
      grid.appendChild(buildStaticFolderCard(label, () => Router.navigate({ type: target })));
    });
    wrap.appendChild(grid);
  } else if (leafText[type]) {
    const p = document.createElement('p');
    p.className = 'about-text';
    p.textContent = leafText[type];
    wrap.appendChild(p);
  }
  // 'about-website' and 'about-contact' have neither — they're intentionally blank pages.

  wrap.appendChild(buildAboutBackButton());
}

function renderCurrentView(){
  const view = Router.current();
  if (view.type === 'page') renderPageView(view.pageId);
  else if (view.type === 'about') renderAboutView();
  else if (AboutNav[view.type]) renderAboutSubView(view.type);
  else if (view.type === 'home') renderHomeView();
  else renderEmptyView();
  renderBreadcrumb();
  renderTopbarActions();
  renderSidebar();
}

/* ---------------------------------------------------------------------- */
/* Wiring                                                                  */
/* ---------------------------------------------------------------------- */
function refreshCurrentContent(){
  const view = Router.current();
  if (view.type === 'page') {
    if (Store.getPage(view.pageId)) { renderPageView(view.pageId); renderBreadcrumb(); renderTopbarActions(); }
  } else if (view.type === 'home') {
    renderHomeView(); renderBreadcrumb(); renderTopbarActions();
  }
}

Router.subscribe(() => {
  const view = Router.current();
  if (view.type === 'page') Store.expandChain(view.pageId);
  renderCurrentView();
  Menu.close();
});
Store.subscribe((state, reason) => {
  renderSidebar();
  if (reason === 'create' || reason === 'delete' || reason === 'reorder') refreshCurrentContent();
});

document.getElementById('btn-go-home').addEventListener('click', () => {
  Router.navigate({ type:'home' });
  closeSidebarMobile();
});

const btnGoBack = document.getElementById('btn-go-back');
btnGoBack.addEventListener('click', () => {
  Router.back();
  closeSidebarMobile();
});
const btnGoHome = document.getElementById('btn-go-home');
function syncNavButtons(){
  const onHome = Router.current().type === 'home';
  // On Home there is nowhere to go back to, so hide Back (and the redundant Home button).
  btnGoBack.style.display = onHome ? 'none' : '';
  btnGoHome.style.display = onHome ? 'none' : '';
}
Router.subscribeBack((canGoBack) => {
  btnGoBack.classList.toggle('disabled', !canGoBack);
  btnGoBack.setAttribute('aria-disabled', String(!canGoBack));
  syncNavButtons();
});
syncNavButtons();

viewPort.addEventListener('scroll', () => {
  document.getElementById('topbar').classList.toggle('scrolled', viewPort.scrollTop > 4);
});

/* ---------------------------------------------------------------------- */
/* Boot                                                                    */
/* ---------------------------------------------------------------------- */
(function boot(){
  renderCurrentView();
})();
</script>
</body>
